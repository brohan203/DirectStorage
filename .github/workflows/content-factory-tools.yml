name: Content Factory Tools

"on":
  pull_request:
    paths:
    - '.github/workflows/content-factory-tools.yml'
    - 'Docs/**'
    - 'GDeflate/**'
    - 'Tests/**'
    - 'Tools/**'
  push:
    branches:
    - development
    paths:
    - '.github/workflows/content-factory-tools.yml'
    - 'Docs/**'
    - 'GDeflate/**'
    - 'Tests/**'
    - 'Tools/**'

permissions:
  contents: read

env:
  GACL_REVISION: ca03e5ece5951642a02fbcd20b28d1397735e17a

jobs:
  python-and-gdeflate:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: Tests/requirements.txt
    - name: Install test dependencies
      run: python -m pip install -r Tests/requirements.txt
    - name: Configure GDeflate content tool
      run: >-
        cmake -S GDeflate -B ${{ runner.temp }}\gdeflate
        -A x64
        -DGDEFLATE_BUILD_DEMO=OFF
        -DGDEFLATE_BUILD_TESTS=OFF
        -DGDEFLATE_BUILD_CONTENT_TOOL=ON
    - name: Build GDeflate content tool
      run: cmake --build ${{ runner.temp }}\gdeflate --config Release --target GDeflateContentTool --parallel
    - name: Run Python tests
      env:
        GDEFLATE_CONTENT_TOOL: ${{ runner.temp }}\gdeflate\GDeflateContentTool\Release\GDeflateContentTool.exe
      run: python -m pytest Tests -q

  gacl-content-tool:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Clone pinned GACL dependency
      shell: pwsh
      run: |
        git clone --filter=blob:none --no-checkout https://github.com/microsoft/Game-Asset-Conditioning-Library "${{ runner.temp }}\gacl"
        git -C "${{ runner.temp }}\gacl" fetch --depth 1 origin $env:GACL_REVISION
        git -C "${{ runner.temp }}\gacl" checkout --detach FETCH_HEAD
        git -C "${{ runner.temp }}\gacl" submodule update --init --depth 1 ThirdParty/zstd
    - name: Configure GACL content tool
      run: >-
        cmake -S Tools/GACLContentTool -B ${{ runner.temp }}\gacl-content
        -A ${{ matrix.architecture }}
        -DGACL_ROOT=${{ runner.temp }}\gacl
    - name: Build GACL content tool
      run: cmake --build ${{ runner.temp }}\gacl-content --config Release --target GACLContentTool --parallel
    - name: Test GACL content tool
      if: matrix.architecture == 'x64'
      env:
        GACL_CONTENT_TOOL: ${{ runner.temp }}\gacl-content\Release\GACLContentTool.exe
      run: python -m unittest Tests.test_gacl_content_tool -v
