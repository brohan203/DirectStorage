name: Content Factory Tools

"on":
  pull_request:
    paths:
    - '.github/workflows/content-factory-tools.yml'
    - 'ContentFactory/**'
    - 'GDeflate/**'
  push:
    branches:
    - development
    paths:
    - '.github/workflows/content-factory-tools.yml'
    - 'ContentFactory/**'
    - 'GDeflate/**'

permissions:
  contents: read

env:
  GACL_REVISION: ca03e5ece5951642a02fbcd20b28d1397735e17a

jobs:
  python-and-gdeflate:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: ContentFactory/tests/requirements.txt
    - name: Install test dependencies
      run: python -m pip install -r ContentFactory/tests/requirements.txt
    - name: Configure GDeflate content tool
      run: >-
        cmake -S GDeflate -B ${{ runner.temp }}\gdeflate
        -A x64
        -DGDEFLATE_BUILD_DEMO=OFF
        -DGDEFLATE_BUILD_TESTS=OFF
        -DGDEFLATE_BUILD_CONTENT_TOOL=ON
    - name: Build GDeflate content tool
      run: cmake --build ${{ runner.temp }}\gdeflate --config Release --target GDeflateContentTool --parallel
    - name: Run Python tests
      env:
        GDEFLATE_CONTENT_TOOL: ${{ runner.temp }}\gdeflate\GDeflateContentTool\Release\GDeflateContentTool.exe
      run: python -m pytest ContentFactory/tests -q

  gacl-content-tool:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Clone pinned GACL dependency
      shell: pwsh
      run: |
        git clone --filter=blob:none --no-checkout https://github.com/microsoft/Game-Asset-Conditioning-Library "${{ runner.temp }}\gacl"
        git -C "${{ runner.temp }}\gacl" fetch --depth 1 origin $env:GACL_REVISION
        git -C "${{ runner.temp }}\gacl" checkout --detach FETCH_HEAD
        git -C "${{ runner.temp }}\gacl" submodule update --init --depth 1 ThirdParty/zstd
    - name: Configure GACL content tool
      run: >-
        cmake -S ContentFactory/GACLContentTool -B ${{ runner.temp }}\gacl-content
        -A ${{ matrix.architecture }}
        -DGACL_ROOT=${{ runner.temp }}\gacl
    - name: Build GACL content tool
      run: cmake --build ${{ runner.temp }}\gacl-content --config Release --target GACLContentTool --parallel
    - name: Test GACL content tool
      if: matrix.architecture == 'x64'
      env:
        GACL_CONTENT_TOOL: ${{ runner.temp }}\gacl-content\Release\GACLContentTool.exe
      run: python -m pytest ContentFactory/tests/test_gacl_content_tool.py -v

  end-to-end-content-factory:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: python -m pip install -r ContentFactory/tests/requirements.txt
    - name: Clone pinned GACL and Zstd sources
      shell: pwsh
      run: |
        git clone --filter=blob:none --no-checkout https://github.com/microsoft/Game-Asset-Conditioning-Library "${{ runner.temp }}\gacl"
        git -C "${{ runner.temp }}\gacl" fetch --depth 1 origin $env:GACL_REVISION
        git -C "${{ runner.temp }}\gacl" checkout --detach FETCH_HEAD
        git -C "${{ runner.temp }}\gacl" submodule update --init --depth 1 ThirdParty/zstd
    - name: Build GDeflate content tool
      shell: pwsh
      run: |
        cmake -S GDeflate -B "${{ runner.temp }}\gdeflate" -A x64 `
          -DGDEFLATE_BUILD_DEMO=OFF `
          -DGDEFLATE_BUILD_TESTS=OFF `
          -DGDEFLATE_BUILD_CONTENT_TOOL=ON
        cmake --build "${{ runner.temp }}\gdeflate" --config Release --target GDeflateContentTool --parallel
    - name: Build GACL content tool
      shell: pwsh
      run: |
        cmake -S ContentFactory/GACLContentTool -B "${{ runner.temp }}\gacl-content" -A x64 `
          -DGACL_ROOT="${{ runner.temp }}\gacl"
        cmake --build "${{ runner.temp }}\gacl-content" --config Release --target GACLContentTool --parallel
    - name: Build pinned Zstd CLI
      shell: pwsh
      run: |
        cmake -S "${{ runner.temp }}\gacl\ThirdParty\zstd\build\cmake" `
          -B "${{ runner.temp }}\zstd-cli" -A x64 `
          -DZSTD_BUILD_PROGRAMS=ON `
          -DZSTD_BUILD_TESTS=ON `
          -DZSTD_BUILD_CONTRIB=OFF `
          -DZSTD_BUILD_SHARED=OFF `
          -DZSTD_BUILD_STATIC=ON
        cmake --build "${{ runner.temp }}\zstd-cli" --config Release --target zstd --parallel
    - name: Run representative Content Factory workflow
      shell: pwsh
      run: |
        $root = "${{ runner.temp }}\content-factory"
        python ContentFactory\tools\generate-phase2-sources.py phase2-representative --root $root
        python ContentFactory\tools\process-set.py phase2-representative --root $root
        python ContentFactory\tools\run-content-factory.py phase2-representative `
          --root $root `
          --stages all `
          --zstd-exe "${{ runner.temp }}\zstd-cli\programs\Release\zstd.exe" `
          --gdeflate-exe "${{ runner.temp }}\gdeflate\GDeflateContentTool\Release\GDeflateContentTool.exe" `
          --gacl-exe "${{ runner.temp }}\gacl-content\Release\GACLContentTool.exe"
        python ContentFactory\tools\process-set.py phase2-representative --root $root --verify
    - name: Capture generated hashes
      shell: pwsh
      run: |
        $root = "${{ runner.temp }}\content-factory"
        $rootUri = [Uri]((Resolve-Path -LiteralPath $root).Path.TrimEnd('\') + '\')
        $hashes = Get-ChildItem -LiteralPath $root -File -Recurse |
          Where-Object { $_.Name -notlike '*.lock' } |
          ForEach-Object {
            $relative = [Uri]::UnescapeDataString($rootUri.MakeRelativeUri([Uri]$_.FullName).ToString())
            [PSCustomObject]@{ path = $relative; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() }
          } |
          Sort-Object path
        $hashes | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 "${{ runner.temp }}\hashes-before.json"
    - name: Rebuild and verify determinism
      shell: pwsh
      run: |
        $root = "${{ runner.temp }}\content-factory"
        python ContentFactory\tools\run-content-factory.py phase2-representative `
          --root $root `
          --stages all `
          --overwrite `
          --zstd-exe "${{ runner.temp }}\zstd-cli\programs\Release\zstd.exe" `
          --gdeflate-exe "${{ runner.temp }}\gdeflate\GDeflateContentTool\Release\GDeflateContentTool.exe" `
          --gacl-exe "${{ runner.temp }}\gacl-content\Release\GACLContentTool.exe"
        python ContentFactory\tools\process-set.py phase2-representative --root $root --verify
        $rootUri = [Uri]((Resolve-Path -LiteralPath $root).Path.TrimEnd('\') + '\')
        $after = Get-ChildItem -LiteralPath $root -File -Recurse |
          Where-Object { $_.Name -notlike '*.lock' } |
          ForEach-Object {
            $relative = [Uri]::UnescapeDataString($rootUri.MakeRelativeUri([Uri]$_.FullName).ToString())
            [PSCustomObject]@{ path = $relative; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() }
          } |
          Sort-Object path
        $beforeJson = Get-Content -Raw "${{ runner.temp }}\hashes-before.json"
        $afterJson = $after | ConvertTo-Json -Depth 3
        if ($beforeJson.Trim() -ne $afterJson.Trim()) {
          throw 'Content Factory output changed after deterministic overwrite rebuild.'
        }
    - name: Stage diagnostic artifacts
      if: always()
      shell: pwsh
      run: |
        $destination = Join-Path $env:GITHUB_WORKSPACE 'content-factory-e2e'
        New-Item -ItemType Directory -Path $destination -Force | Out-Null
        $manifest = "${{ runner.temp }}\content-factory\manifests\phase2-representative.json"
        $archives = "${{ runner.temp }}\content-factory\dstorage\phase2-representative\dstoragetest.*"
        if (Test-Path -LiteralPath $manifest) { Copy-Item -LiteralPath $manifest $destination }
        if (Test-Path $archives) { Copy-Item $archives $destination }
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: content-factory-e2e
        if-no-files-found: warn
        path: content-factory-e2e
